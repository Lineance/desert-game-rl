[project]
name = "task2-desert-rl"
version = "0.1.0"
description = "RL solution for Desert Crossing task2"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.24",
  "torch>=2.2",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "pulp>=2.8",
  "highspy>=1.13.1",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "tsinghua"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
jinja2 = { index = "tsinghua" }
markupsafe = { index = "tsinghua" }
